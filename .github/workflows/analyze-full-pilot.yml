name: Analyze Completed Full Pilot
on:
  workflow_run:
    workflows: ["Resume Full Pilot with Same-Model Provider Fallback"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'abdullah-x-bd/llm-priority-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch successful 720-cell artifact
        uses: actions/download-artifact@v4
        with:
          name: full-pilot-fallback-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: results/private/
      - name: Validate exactly 720 observations without touching confirmatory data
        run: |
          python scripts/research_pipeline.py check --phase pilot --input results/private/full-pilot-live-records.jsonl
      - name: Resolve actual providers using non-billable generation lookups
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -u scripts/hydrate_provider_metadata.py --input results/private/full-pilot-live-records.jsonl --output results/private/full-pilot-hydrated.jsonl --issues results/private/full-pilot-provider-issues.json
      - name: Produce predeclared exploratory feasibility report
        run: |
          INPUT=results/private/full-pilot-hydrated.jsonl
          if [ ! -f "$INPUT" ]; then INPUT=results/private/full-pilot-live-records.jsonl; fi
          python scripts/pilot_feasibility.py "$INPUT" results/private/full-pilot-feasibility.json
          python scripts/research_pipeline.py analyze --phase pilot --input "$INPUT"
      - name: Preserve original, canonical, reconciled and aggregate pilot records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-full-pilot-${{ github.run_id }}
          path: |
            results/private/full-pilot-live-checkpoint.json
            results/private/full-pilot-live-records.jsonl
            results/private/full-pilot-live-report.json
            results/private/full-pilot-hydrated.jsonl
            results/private/full-pilot-provider-issues.json
            results/private/full-pilot-feasibility.json
          if-no-files-found: warn
          retention-days: 90
