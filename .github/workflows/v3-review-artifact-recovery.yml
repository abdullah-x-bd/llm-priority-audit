name: Recover Completed V3 Reviews Without Paid Calls
on:
  push:
    branches: [main]
    paths: [config/v3-artifact-recovery.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: llm-priority-v3-review-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'abdullah-x-bd/llm-priority-audit' && contains(github.event.head_commit.message, 'RECOVER_V3_REVIEW_ARTIFACT_NO_API')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest repository main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download existing artifact with GitHub CLI, no model APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38070527054 --repo abdullah-x-bd/llm-priority-audit --name v3-external-reviews-38070527054 --dir /tmp/v3-review-archive
          find /tmp/v3-review-archive -type f | sort
      - name: Verify original model review results and recover exactly two public files
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          cfg=json.loads(Path('config/v3-artifact-recovery.json').read_text())
          assert cfg=={
            'artifact_id':11676728306,'run_id':38070527054,
            'expected_attempts':70,'expected_usable':69,
            'max_known_cost_usd':1.25,'allow_any_model_calls':False,
            'operation':'recover-saved-review-documents-only'
          }
          folder=Path('/tmp/v3-review-archive')
          def read_exact(name):
              matches=[p for p in folder.rglob(name) if p.is_file()]
              assert len(matches)==1,(name,[str(p) for p in matches])
              return matches[0].read_bytes()
          doc_bytes=read_exact('33-v3-external-model-review-archive.md')
          accounting_bytes=read_exact('34-v3-external-review-accounting.json')
          account=json.loads(accounting_bytes)
          assert account['overall_attempted']==4
          assert account['scenario_attempted']==66
          assert account['overall_usable']==3
          assert account['scenario_usable']==66
          assert account['external_model_review_count']==cfg['expected_usable']
          assert account['paid_v3_behavioral_calls']==0
          assert 0<=account['new_known_cost_usd']<=cfg['max_known_cost_usd']
          assert account['new_unknown_liability_reserved_usd']==0
          assert account['independent_human_reviews']==0
          assert account['status']=='COMPLETE'
          text=doc_bytes.decode('utf-8')
          assert text.count('### overall-')==4
          assert text.count('### case-')==66
          assert all(x in text for x in ('claude-opus-5.5','gpt-6-astra','grok-4.7'))
          for name,blob in [('33-v3-external-model-review-archive.md',doc_bytes),
                            ('34-v3-external-review-accounting.json',accounting_bytes)]:
              dst=Path('docs')/name
              if dst.exists() and dst.read_bytes()!=blob:
                  raise RuntimeError('Existing published file conflicts: '+name)
              dst.write_bytes(blob)
              print('Validated and recovered:',name,'sha256',hashlib.sha256(blob).hexdigest())
          print('RECOVERY PASS. No model inference; 69 usable reviews recovered.')
          PY
      - name: Commit saved reviews without overwriting concurrent work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/33-v3-external-model-review-archive.md docs/34-v3-external-review-accounting.json
          if git diff --cached --quiet; then
            echo 'Identical archived reviews already present'
            exit 0
          fi
          git commit -m 'Recover 70 previously paid V3 model reviews verbatim without API calls'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
