name: V4.2 Frozen Four-Model Main (One Authorized Upload)
on:
  push:
    branches: [main]
    paths:
      - research/v4_2_frozen_source.zip
permissions:
  contents: write
  actions: read
concurrency:
  group: v4-2-frozen-main-explicit-upload-once
  cancel-in-progress: false
jobs:
  frozen-main:
    if: github.repository == 'abdullah-x-bd/llm-priority-audit' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'AUTHORIZE_V4_2_MAIN_1920_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject prior launch artifacts and repeated paid experiments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?per_page=100'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          req=urllib.request.Request(url,headers=h)
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          if any(a.get('name','').startswith('v4_2-main-attempt-') for a in data.get('artifacts',[])):
              raise SystemExit('STOP: prior V4.2 main attempt already archived; never repurchase results')
          PY
      - name: Verify exact uploaded archive and frozen 1920-row scenario manifest
        run: |
          python - <<'PY'
          import hashlib,json,zipfile,pathlib,shutil
          source=pathlib.Path('research/v4_2_frozen_source.zip')
          required='3f16719fd7aa0a8ab74d2320b70e74778f6c9ac51df2a73d28d85d9cc526132b'
          assert source.is_file(), 'Uploaded file absent; no calls made'
          actual=hashlib.sha256(source.read_bytes()).hexdigest()
          assert actual==required, 'Not the exact reviewed V4.2 archive; no calls made'
          with zipfile.ZipFile(source) as z:
              bad=z.testzip();assert bad is None,bad
              for member in z.namelist():
                  p=pathlib.PurePosixPath(member)
                  assert not p.is_absolute() and '..' not in p.parts, 'Unsafe archive path'
              z.extractall('.')
          base=pathlib.Path('agent_priority_v4_2_provider_frozen')
          m=base/'priority_agent_study_packet/review_integrated/provisional_1920_four_model_call_manifest.jsonl'
          assert hashlib.sha256(m.read_bytes()).hexdigest()=='c9bf735fc67a7a6e5ac6c86e9c5d9889bc7eab8af04389eef7bf71d513af39d5', 'Manifest does not match scientific freeze'
          rows=[json.loads(t) for t in m.read_text().splitlines() if t.strip()]
          assert len(rows)==1920 and [x['execution_index'] for x in rows]==list(range(1920))
          assert len({(r['model_candidate_unverified'],r['prompt_sha256']) for r in rows})==1920
          assert len({r['scenario_id'] for r in rows})==60
          # Budget cap adjustment only. No mutation of frozen messages, action mappings or selection.
          f=base/'priority_agent_study_packet/review_integrated/execution_policy.json'
          p=json.loads(f.read_text());assert p['project_study_new_spend_cap_usd']==3.0
          p['project_study_new_spend_cap_usd']=3.5
          f.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          c=base/'priority_collect.py';s=c.read_text()
          assert s.count("policy['project_study_new_spend_cap_usd']==3.0")==1
          assert s.count("'max_budget_usd':3.0")>=2
          assert s.count("+policy['uncertain_cost_margin_usd']>3.0")==1
          s=s.replace("policy['project_study_new_spend_cap_usd']==3.0","policy['project_study_new_spend_cap_usd']==3.5")
          s=s.replace("'max_budget_usd':3.0","'max_budget_usd':3.5")
          s=s.replace("+policy['uncertain_cost_margin_usd']>3.0","+policy['uncertain_cost_margin_usd']>3.5")
          c.write_text(s)
          print('EXACT V4.2 ARCHIVE VERIFIED. 1920 frozen main cells. 3.50 maximum incremental cap.')
          PY
      - name: Run prospective offline parser and statistical unit tests with no model calls
        run: |
          cd agent_priority_v4_2_provider_frozen
          python priority_collect.py --mode check
          python priority_analyze.py --mode check
          python run_postreview_integrity_audit.py
      - name: Collect exactly the frozen main requests, no automatic generation retries
        id: main
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_PRIORITY_MAIN_AUTHORIZATION: I_AUTHORIZE_1920_MAIN_PAID_CALLS
        run: |
          cd agent_priority_v4_2_provider_frozen
          python -u priority_collect.py --mode collect
      - name: Analyze all attempted outcomes using prespecified rules
        if: always()
        run: |
          cd agent_priority_v4_2_provider_frozen
          if [ -s priority_agent_study_packet/review_integrated/private_main_raw_responses.jsonl ]; then
            python priority_analyze.py --mode analyze
          else
            echo 'No main outcomes available for analysis.'
          fi
      - name: Archive original 1920 frozen rows and every available raw request/response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4_2-main-attempt-${{ github.run_id }}
          path: |
            agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/private_main_raw_responses.jsonl
            agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/run_ledger.json
            agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/FINAL_RESULTS_PROSPECTIVE_ANALYSIS.json
            agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/provisional_1920_four_model_call_manifest.jsonl
            agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/LIVE_VERIFIED_ROUTES.json
            agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/execution_policy.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish immutable analysis report, without rewriting or dropping raw outcomes
        if: always()
        run: |
          if [ -s agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/FINAL_RESULTS_PROSPECTIVE_ANALYSIS.json ]; then
            mkdir -p results/public/v4_2
            cp agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/FINAL_RESULTS_PROSPECTIVE_ANALYSIS.json results/public/v4_2/FINAL_RESULTS_PROSPECTIVE_ANALYSIS.json
            cp agent_priority_v4_2_provider_frozen/priority_agent_study_packet/review_integrated/run_ledger.json results/public/v4_2/run_ledger.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add results/public/v4_2/
            git commit -m 'Archive V4.2 four-model frozen study prospective results and missingness' || true
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
