name: V3.1 Surgical Economic Redesign Offline Audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v3_1_economic_design.py'
      - 'data/v3_1/context_inventory.jsonl'
      - 'tests/test_v3_1_economic_design.py'
      - 'docs/39-v3_1-surgical-economic-protocol.md'
      - '.github/workflows/v3_1-offline-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v3_1-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run versioned V3.1 economic design integrity tests
        run: python -m unittest discover -s tests -p 'test_v3_1_economic_design.py' -v
      - name: Generate main and calibration manifests with no inference
        run: python scripts/v3_1_economic_design.py --phase both --out-dir /tmp/v3_1-offline
      - name: Check exact manifest counts and zero authorizations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v3_1-offline')
          for phase,contexts,choice,arithmetic,paired,slots in [
             ('main',60,1680,0,480,120),
             ('calibration',6,168,120,48,12)
          ]:
              r=json.loads((p/f'v3_1-{phase}-audit.json').read_text())
              assert r['contexts']==contexts and r['delegated_templates_per_model']==choice
              assert r['arithmetic_control_templates_per_model']==arithmetic
              assert r['presentation_order_paired_cases_per_model']==paired
              assert r['blank_human_review_slots']==slots
              assert r['signed_human_reviews']==0 and r['authorized_paid_calls']==0
          print('All V3.1 offline checks pass; zero provider calls.')
          PY
      - name: Publish verified offline audit and two sample prompts (no model calls)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v3_1-offline')
          main=json.loads((p/'v3_1-main-audit.json').read_text())
          cal=json.loads((p/'v3_1-calibration-audit.json').read_text())
          Path('docs/40-v3_1-offline-ci-audit.json').write_text(json.dumps({
              'ci_verified_offline':True,'main':main,'calibration':cal,
              'external_human_review_completed':False,'live_model_calls':0,
              'approval_for_calibration_or_main':False
          },indent=2)+'\\n')
          manifest=[json.loads(line) for line in
              (p/'v3_1-main-offline-unapproved.jsonl').read_text().splitlines()]
          samples=[]
          for domain in ('continuation','reversibility','verification'):
              row=next(r for r in manifest if r['domain']==domain and
                  r['mode']=='delegated' and r['cost_level']=='below_break_even' and
                  r['q_label']=='A' and r['display_order']=='Q_N' and
                  r['presentation']=='time_first')
              samples.extend(['## '+domain.title()+' worked example','',
                  'Q and N expected total work minutes (research reference): '+
                  str(row['expected_q_minutes_hundredths']/100)+', '+
                  str(row['expected_n_minutes_hundredths']/100)+'.','',
                  '```text',row['system_message'],'',row['user_message'],'```',''])
          Path('docs/41-v3_1-example-model-prompts.md').write_text(
              '# V3.1 exact example prompts, offline and unapproved\\n\\n'+
              '\\n'.join(samples),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/40-v3_1-offline-ci-audit.json docs/41-v3_1-example-model-prompts.md
          git commit -m 'Archive passing V3.1 offline unit tests, manifest counts and model-facing examples' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve sample prompts and blank review packets
        uses: actions/upload-artifact@v4
        with:
          name: v3_1-offline-unapproved-${{ github.run_id }}
          path: /tmp/v3_1-offline/
          retention-days: 30
