name: Scenario integrity

on:
  push:
    branches: [main]
    paths:
      - "data/scenarios/**"
      - "data/pilot/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/scenario-integrity.yml"
  pull_request:
    paths:
      - "data/scenarios/**"
      - "data/pilot/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/scenario-integrity.yml"

jobs:
  validate-offline-design:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural and factorial audit
        run: python scripts/validate_scenarios.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Assumption-only precision simulator smoke test
        run: python scripts/precision_simulation.py --replications 100 > /tmp/precision-planning.json
      - name: Mechanism clustering and pricing stress tests (offline)
        run: |
          python scripts/precision_mechanism_sensitivity.py | tee /tmp/cluster-sensitivity.json
          python scripts/budget_stress.py | tee /tmp/budget-stress.json
      - name: Pre-pilot go/no-go evidence (report only; independent review remains pending)
        run: python scripts/prepilot_gate.py | tee /tmp/prepilot-gate.json
      - name: Mechanism-clustered inference calibration (synthetic only)
        run: python scripts/precision_calibration.py --reps 1000 --output /tmp/precision-calibration.json
      - name: Render manifest without external API calls
        run: |
          python scripts/expand_design.py --phase main --output /tmp/main-manifest.jsonl
          python scripts/expand_design.py --phase pilot --output /tmp/pilot-manifest.jsonl
          test "$(wc -l < /tmp/main-manifest.jsonl)" -eq 1440
          test "$(wc -l < /tmp/pilot-manifest.jsonl)" -eq 144
